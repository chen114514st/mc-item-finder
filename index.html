<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<title>MC 物品查询器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">🧱</span>
    <div class="titles">
      <h1>MC 物品查询器</h1>
      <p class="sub" id="subline">加载中…</p>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题">🌙</button>
  </div>

  <div class="searchbar">
    <span class="sicon">🔍</span>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
           placeholder="搜索：中文 / English / 拼音（mjs）/ 变体名">
    <button class="icon-btn" id="clearBtn" hidden aria-label="清空搜索">✕</button>
  </div>

  <nav class="chips" id="chips" aria-label="分类筛选"></nav>
</header>

<main>
  <div class="statusbar">
    <span id="stat">…</span>
    <div class="selects">
      <label>版本 <select id="verSel"></select></label>
      <label>语言 <select id="langSel"></select></label>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div id="sentinel" class="sentinel"></div>
  <div class="empty" id="empty" hidden>
    <p class="emoji">🫥</p>
    <p>没有找到匹配的物品</p>
    <p class="hint">试试更短的关键词，或切换分类</p>
  </div>

  <footer class="about">
    <p>数据：<a href="https://github.com/PrismarineJS/minecraft-data" target="_blank" rel="noopener">PrismarineJS/minecraft-data</a>（Java 版 + 基岩版）
      · 翻译：<a href="https://github.com/PandaDevOfficial/Minecraft-All-Lang" target="_blank" rel="noopener">Minecraft-All-Lang</a>
      + <a href="https://github.com/misode/mcmeta" target="_blank" rel="noopener">mcmeta</a></p>
    <p class="hint">支持物品全部变体（药水 / 附魔书 / 山羊角 / 画 / 烟花等）与方块状态属性；基岩版条目使用基岩版 ID。</p>
    <p id="built"></p>
    <p class="hint">贴图取自 Minecraft 官方客户端资源，仅本地个人使用。</p>
  </footer>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-label="物品详情">
    <button class="sheet-close icon-btn" data-close aria-label="关闭">✕</button>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="core.js"></script>
<script src="data/meta.js"></script>
<script src="app.js"></script>
</body>
</html>
